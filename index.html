<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport="content="width=device-width, initial-scale=1.0">
    <title>GadgetMart - Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>GadgetMart</h1>
    </header>

    <main>
        <figure class="card">
            <img src="https://cdn.thewirecutter.com/wp-content/media/2023/06/fitnesstrackers-2048px-09819-3x2-1.jpg?auto=webp&quality=75&crop=1:1,smart&width=1024" alt="Smart Watch with fitness tracking features">
            <figcaption>
                <h2 class="title">Smart Watch Pro</h2>
                <p class="price">18915.04 INR</p>
                <ul class="features">
                    <li>Heart rate monitoring</li>
                    <li>GPS tracking</li>
                    <li>Water resistant</li>
                    <li>7-day battery life</li>
                </ul>
            </figcaption>
        </figure>

        <figure class="card">
            <img src="https://cdn.thewirecutter.com/wp-content/media/2023/06/fitnesstrackers-2048px-09819-3x2-1.jpg?auto=webp&quality=75&crop=1:1,smart&width=1024">
                <h2 class="title">Wireless Earbuds Elite</h2>
                <p class="price">14186.05 INR</p>
                <ul class="features">
                    <li>Active noise cancellation</li>
                    <li>30-hour battery life</li>
                    <li>Waterproof design</li>
                    <li>Touch controls</li>
                </ul>
            </figcaption>
        </figure>

        <figure class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbOXFz-h9UKnP7NiEoYSuUKWvEcUlxgyIz1fRPj_eKcQ&s=10" alt="Portable Power Bank for mobile devices">
            <figcaption>
                <h2 class="title">Portable Power Bank</h2>
                <p class="price">7565.45 INR</p>
                <ul class="features">
                    <li>20000mAh capacity</li>
                    <li>Fast charging support</li>
                    <li>Dual USB ports</li>
                    <li>LED power indicator</li>
                </ul>
            </figcaption>
        </figure>
    </main>
</body>
</html>
